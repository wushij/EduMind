server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: prod
  application:
    name: edu-mind-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/edumind?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

management:
  health:
    redis:
      enabled: true

sa-token:
  token-name: satoken
  timeout: 86400
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

edumind:
  rate-limit:
    enabled: true
  ai:
    daily-quota: 500
