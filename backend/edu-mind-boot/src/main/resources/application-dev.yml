mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: edumind

ai:
  llm:
    provider: openai-compatible
    api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY:}}
    base-url: https://api.deepseek.com
    model: deepseek-chat
    timeout-ms: 180000
    mock-enabled: false   # 与 prod 一致：真 API；Key 走环境变量或后台「模型配置」
    stream-enabled: true

knowledge:
  ocr:
    mock-enabled: true    # 未部署 Paddle 时用 Mock；配 PADDLE_OCR_BASE_URL 后可改为 false
    engine: mock
    paddle:
      base-url: ${PADDLE_OCR_BASE_URL:}

edumind:
  tenant:
    demo-auto-bind-enabled: true
  security:
    sm-enabled: false
    # 国密主密钥：代码已移除内置默认值，缺失会启动失败(Fail-Fast)。
    # 生产必须通过环境变量 EDUMIND_SECURITY_MASTER_SECRET 注入随机密钥；此处默认值仅供本地开发/演示。
    master-secret: ${EDUMIND_SECURITY_MASTER_SECRET:EduMind_Memory_Key_Seed_2026}
    # true=检测到演示主密钥时拒绝启动（生产建议开启）
    reject-demo-master-secret: false
    kdf-migration:
      # 存量密文 KDF 加固迁移（幂等：新 KDF 能解开的跳过；可关闭）
      enabled: true
    default-key-alias: edumind-data-key
    model-key-alias: edumind-model-key
  ai:
    model-key-secret: EduMind_AI_Model_KEK_2026
    gateway:
      enabled: true
      force-fail-model: ''
  rate-limit:
    enabled: false
  rag:
    hybrid-enabled: true
    min-rrf-score: 0.005
  chunk:
    size: 800
    overlap: 128
  embedding:
    base-url: https://api.openai.com
    api-key: ${EMBEDDING_API_KEY:}
    model: text-embedding-3-small
    dimensions: 1536
    mock-enabled: true   # 仅当后台 embedding 与 yaml 均无 Key 时走 Mock；已配后台模型则自动真向量
  milvus:
    enabled: false       # dev 默认 false → InMemoryVectorStore；联调 Milvus 时设为 true
    host: localhost
    port: 19530
    collection: edumind_chunks
    dimension: 1536      # 需与 embedding.dimensions 一致
