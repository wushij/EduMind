mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: edumind

ai:
  llm:
    provider: openai-compatible
    api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY:}}
    base-url: https://api.deepseek.com
    model: deepseek-chat
    timeout-ms: 60000
    mock-enabled: false   # 与 prod 一致：真 API；Key 走环境变量或后台「模型配置」
    stream-enabled: true

knowledge:
  ocr:
    mock-enabled: true    # 未部署 Paddle 时用 Mock；配 PADDLE_OCR_BASE_URL 后可改为 false
    engine: mock
    paddle:
      base-url: ${PADDLE_OCR_BASE_URL:}

edumind:
  tenant:
    demo-auto-bind-enabled: true
  security:
    sm-enabled: false
    master-secret: EduMind_Memory_Key_Seed_2026
    default-key-alias: edumind-data-key
    model-key-alias: edumind-model-key
  ai:
    model-key-secret: EduMind_AI_Model_KEK_2026
    gateway:
      enabled: true
      force-fail-model: ''
  rate-limit:
    enabled: false
  chunk:
    size: 800
    overlap: 128
  embedding:
    base-url: https://api.openai.com
    api-key: ${EMBEDDING_API_KEY:}
    model: text-embedding-3-small
    dimensions: 1536
    mock-enabled: true   # dev 默认 true；联调真实向量时设为 false
  milvus:
    enabled: false       # dev 默认 false → InMemoryVectorStore；联调 Milvus 时设为 true
    host: localhost
    port: 19530
    collection: edumind_chunks
    dimension: 1536      # 需与 embedding.dimensions 一致
