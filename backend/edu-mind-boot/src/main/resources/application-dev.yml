mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: edumind

ai:
  llm:
    provider: openai-compatible
    api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY:}}
    base-url: https://api.deepseek.com
    model: deepseek-chat
    timeout-ms: 60000
    mock-enabled: false   # 真实模型走后台「模型配置」；仅 Gateway 降级链保留 mock
    stream-enabled: true

edumind:
  tenant:
    demo-auto-bind-enabled: true
  security:
    sm-enabled: false
  ai:
    model-key-secret: EduMind_AI_Model_KEK_2026
    gateway:
      enabled: true
      force-fail-model: ''
  rate-limit:
    enabled: false
  chunk:
    size: 800
    overlap: 128
  embedding:
    base-url: https://api.openai.com
    api-key: ${EMBEDDING_API_KEY:}
    model: text-embedding-3-small
    dimensions: 1536
    mock-enabled: true   # dev 默认 true；联调真实向量时设为 false
  milvus:
    enabled: false       # dev 默认 false → InMemoryVectorStore；联调 Milvus 时设为 true
    host: localhost
    port: 19530
    collection: edumind_chunks
    dimension: 1536      # 需与 embedding.dimensions 一致
